name: Build and sync GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/site-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-sync-main
  cancel-in-progress: true

jobs:
  build-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run audio:audit
      - run: npm run site
      - name: Commit generated Pages artifacts
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js manifest.webmanifest icon-192.png icon-512.png models vo audio
          if git diff --cached --quiet; then
            echo "Generated Pages artifacts already current"
            exit 0
          fi
          git commit -m "chore(site): sync generated Pages artifacts [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
