name: Clinical app validation
on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'tools/validate_visual_assets.py', '.github/workflows/app-ci.yml']
  push:
    branches: ['feat/clinical-completion-*']
    paths: ['app/**', '.github/workflows/app-ci.yml']
permissions:
  contents: read
concurrency:
  group: app-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run audio:audit
      - run: npm run site
      - name: Validate generated visual assets
        run: python ../tools/validate_visual_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: clinical-app-production-build
          path: app/dist/pub
          retention-days: 7
