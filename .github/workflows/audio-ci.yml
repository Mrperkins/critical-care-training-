name: Audio Mastery CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-care-main-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: app/public/imaging/curated
          key: verified-clinical-mri-${{ hashFiles('app/clinical-archive.json') }}
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run audio:audit
      # The audio workflow validates the standalone audio build; the clinical release
      # workflow handles source-verified MRI media and complete site packaging.
      - run: npm run build
      - name: Assert standalone audio build
        run: |
          test -s dist/pub/audio/index.html
          grep -q "Critical Care Audio" dist/pub/audio/index.html
