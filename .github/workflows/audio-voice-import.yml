name: Import Audio Voice Assets

on:
  push:
    branches: [main, mental-reps-hands-on, mental-reps-airway-pocus-v3]
    paths:
      - app/public/audio/voice/import.json
      - app/src/audio/catalog.ts
      - app/src/audio/mastery.ts
      - app/src/audio/masteryNotes.ts
      - app/src/audio/expertEpisodes.ts
      - app/src/audio/scriptDraft.ts
      - app/scripts/audio-voice-lines.ts
      - app/scripts/audio_voice_import.py
      - .github/workflows/audio-voice-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-voice-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Install audio validator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
        working-directory: .
      - run: npm run audio:lines
      - run: python3 scripts/audio_voice_import.py
      - run: python3 scripts/audio_voice_validate.py
      - name: Commit durable assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/voice
          if git diff --cached --quiet; then
            echo "No voice asset changes"
          else
            git commit -m "chore(audio): import durable natural-voice prototypes [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }}
              if git push origin HEAD:${{ github.ref_name }}; then
                exit 0
              fi
              echo "Voice asset push raced with branch update; retrying ($attempt/5)"
              sleep $((attempt * 2))
            done
            echo "Unable to publish durable voice assets after retries" >&2
            exit 1
          fi
