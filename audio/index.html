ure after adequate first-line treatment means the treatment phase has changed. Prepare second-line therapy and escalation rather than restarting the same loop."},{id:"airway",phase:"decision",title:"Airway decisions are physiology decisions",narration:"Refractory seizure, medication effect, hypoventilation or loss of airway protection may require airway control\u2014but the post-intubation sedation plan must also treat ongoing seizure risk.",danger:!0},{id:"silent",phase:"confirmation",title:"No convulsions does not guarantee no seizure",narration:"Persistent coma or unexplained mental status after convulsions stop should raise concern for nonconvulsive status and the need for EEG when available.",visual:"seizure-eeg"},{id:"debrief",phase:"debrief",title:"Mental anchor",narration:"Time, stabilize, adequate first-line therapy, change phases when it fails, secure physiology when needed, and remember that seizure activity can become invisible."}]},{id:"rep-pocus-shock",title:"Critical-care POCUS shock survey",subtitle:"Heart, lung, venous and abdominal windows organized around one hemodynamic question.",level:4,domain:"procedures",minutes:14,concepts:["critical-care-echo","lung-ultrasound","efast","shock"],disclaimer:"Mental rehearsal only. Point-of-care ultrasound requires supervised image-acquisition and interpretation training; focused findings must be integrated with the patient and escalated to comprehensive imaging when needed.",beats:[{id:"question",phase:"arrival",title:"Ask the question before touching the probe",narration:"The patient is in shock. Do not begin by collecting pretty views. State what you need to know: pump failure, right-heart pressure load, pericardial constraint, lung congestion, pneumothorax, free fluid, or another cause of instability.",visual:"pocus-map"},{id:"heart",phase:"orientation",title:"Interrogate the heart from more than one view",narration:"Choose a cardiac window and prove the orientation using your local probe-marker convention. For subxiphoid imaging, start just below the xiphoid and use the liver as the acoustic window toward the heart. For parasternal views, move to the left sternal border; for apical views, move toward the point of maximal impulse and avoid foreshortening. Identify chambers before judging size or function, and do not call tamponade or right-heart strain from one uncertain view.",visual:"pocus-heart",prompt:"Which finding would make you change your fluid or positive-pressure strategy immediately?"},{id:"lung",phase:"sequence",title:"Map the lungs bilaterally",narration:"Place the probe between two ribs and first identify the two rib shadows with the bright pleural line between them. Once the pleural surface is proven, scan matched anterior, lateral and posterior zones on both sides. At each zone watch for sliding, A-lines, B-lines, consolidation and pleural fluid, then compare the distribution. If you cannot confidently identify the pleural line, stop and re-orient before interpreting pneumothorax.",visual:"pocus-lung"},{id:"venous",phase:"decision",title:"Venous findings are context, not a volume-status oracle",narration:"For the IVC, start subxiphoid with the liver as your window and identify the vessel entering the right atrium. Distinguish it from the aorta by its course, wall and pulsatility, then sweep along the IVC and watch what happens with respiration. Add other venous Doppler views only when they answer your question and are within your training. Do not turn one IVC diameter or collapse pattern into an automatic command to give or withhold fluid.",visual:"pocus-venous"},{id:"abdomen",phase:"sequence",title:"Look for the abdominal problem that changes the resuscitation",narration:"When bleeding or aortic catastrophe is plausible, move through a repeatable abdominal sequence. In the right upper quadrant, identify liver, kidney and diaphragm before searching their dependent spaces; on the left, prove spleen, kidney and diaphragm. In the pelvis, use the bladder as the anchor. For the aorta, identify it in the epigastrium and follow it distally rather than measuring a single dark circle. A negative FAST does not exclude retroperitoneal bleeding and can become positive later.",visual:"pocus-abdomen"},{id:"integrate",phase:"decision",title:"Build one shock model",narration:"Now stop scanning. Integrate the heart, lungs, venous system, abdomen, blood pressure, capnography and clinical examination into one working physiologic model. Make a prediction about what your next intervention should change.",visual:"pocus-integrate",prompt:"What finding would falsify your current shock model?"},{id:"debrief",phase:"debrief",title:"Mental anchor",narration:"Question, cardiac views, lung map, venous context, abdominal question, then integration. POCUS is not a collection of images. It is bedside evidence used to test a physiologic hypothesis."}]}],Ts=Object.fromEntries(Pe.map(e=>[e.id,e])),Is=Object.fromEntries(pt.map(e=>[e.id,e]));var As=[{level:1,name:"Language & normal physiology",description:"Anatomy, terminology, normal values and causal relationships."},{level:2,name:"Single-system critical illness",description:"Recognize, explain and initially manage major critical-care syndromes."},{level:3,name:"Organ support",description:"Ventilation, vasoactives, transfusion, sedation, invasive monitoring and procedures."},{level:4,name:"Advanced physiology",description:"Predict responses using pressure, flow, gas exchange, oxygen transport, acid-base and PK/PD."},{level:5,name:"Multisystem critical care",description:"Balance competing organ priorities and understand treatment tradeoffs."},{level:6,name:"Expert integration",description:"Reason through ambiguity, uncertainty, cognitive traps, evolving physiology and imperfect evidence."}],Ze={foundations:"Foundations",respiratory:"Respiratory",hemodynamics:"Hemodynamics & shock",cardiac:"Cardiovascular",neuro:"Neurocritical care","renal-metabolic":"Renal, endocrine & metabolic",infectious:"Sepsis & infection",hematology:"Hematology & coagulation",pharmacology:"Pharmacology","imaging-monitoring":"Imaging & monitoring",procedures:"Procedures & devices",multisystem:"Multisystem integration","communication-systems":"Communication, ethics & ICU systems","gi-hepatic":"Gastrointestinal & hepatic",endocrine:"Endocrine emergencies",toxicology:"Critical care toxicology",transplant:"Transplant & immunosuppression","trauma-burns":"Trauma & burns",obstetric:"Obstetric critical care","peds-neonatal":"Pediatric & neonatal critical care",recovery:"Liberation & recovery"},Tn=[{id:"preload",name:"Preload",domain:"foundations",level:1,summary:"The loading conditions of a ventricle before contraction; not synonymous with a single pressure or volume.",prereq:[],related:["venous-return","fluid-responsiveness","rv-failure"],vocabulary:["end-diastolic volume","transmural pressure"],performance:["Distinguish preload from CVP or fluid responsiveness.","Predict how changes in intrathoracic pressure alter measured filling pressures."]},{id:"venous-return",name:"Venous return",domain:"hemodynamics",level:4,summary:"Flow back to the right heart determined by the pressure gradient from the systemic circulation and resistance to venous return.",prereq:["preload"],related:["stressed-volume","rv-failure","ppv-hemodynamics"],vocabulary:["mean systemic filling pressure","stressed volume","venous return gradient"],performance:["Explain why CVP can rise while venous return falls.","Predict effects of vasodilation, venoconstriction and positive pressure on venous return."]},{id:"stressed-volume",name:"Stressed vs unstressed volume",domain:"hemodynamics",level:4,summary:"The fraction of blood volume generating elastic recoil pressure versus volume that fills the vasculature without generating pressure.",prereq:["preload"],related:["venous-return"],vocabulary:["mean systemic filling pressure","venous capacitance"],performance:["Explain how venoconstriction can recruit unstressed volume without giving fluid."]},{id:"fluid-responsiveness",name:"Fluid responsiveness",domain:"hemodynamics",level:3,summary:"Whether stroke volume will meaningfully increase after an increase in preload; distinct from whether fluid is indicated or safe.",prereq:["preload"],related:["venous-return","rv-failure"],vocabulary:["dynamic assessment","passive leg raise"],performance:["Separate responsiveness from tolerance and need.","Interpret dynamic tests in their physiologic context and recognize limitations."]},{id:"rv-failure",name:"Right ventricular failure",domain:"cardiac",level:4,summary:"Failure of a thin-walled ventricle that is highly sensitive to acute afterload, volume, perfusion pressure and ventricular interaction.",prereq:["preload","venous-return"],related:["pvr","ventricular-interdependence","ppv-hemodynamics","pe"],vocabulary:["RV-PA coupling","septal shift","transmural pressure"],performance:["Recognize RV shock physiology before systemic hypotension becomes profound.","Predict how PEEP, hypercapnia, hypoxemia, fluids and vasoactives may change RV performance."]},{id:"pvr",name:"Pulmonary vascular resistance",domain:"cardiac",level:4,summary:"Resistance faced by the RV, influenced by lung volume, oxygenation, CO2, pH, pulmonary vascular disease and mechanical ventilation.",prereq:["preload"],related:["rv-failure","ppv-hemodynamics","ards"],vocabulary:["RV afterload","West zones"],performance:["Explain the U-shaped relationship between lung volume and pulmonary vascular resistance.","Identify reversible contributors to acute RV afterload."]},{id:"ventricular-interdependence",name:"Ventricular interdependence",domain:"cardiac",level:4,summary:"The ventricles share a septum and constrained pericardial space, so pressure or volume loading of one changes filling and geometry of the other.",prereq:["rv-failure"],related:["tamponade","ppv-hemodynamics"],vocabulary:["septal shift","pericardial constraint"],performance:["Use septal position and loading conditions to explain falling LV output during RV distension."]},{id:"ppv-hemodynamics",name:"Positive-pressure ventilation & circulation",domain:"respiratory",level:4,summary:"Positive intrathoracic pressure changes venous return, ventricular transmural pressures and pulmonary vascular resistance.",prereq:["preload"],related:["rv-failure","pvr","peep"],vocabulary:["transmural pressure","mean airway pressure"],performance:["Predict why induction and positive pressure can precipitate hypotension.","Distinguish effects on RV preload, RV afterload and LV transmural afterload."]},{id:"peep",name:"PEEP",domain:"respiratory",level:2,summary:"Positive end-expiratory pressure used to preserve recruitment and oxygenation, with important mechanical and hemodynamic effects.",prereq:[],related:["ards","ppv-hemodynamics","driving-pressure"],vocabulary:["recruitability","intrinsic PEEP"],performance:["Explain when increasing PEEP may recruit lung versus overdistend it.","Anticipate circulatory effects in preload-dependent or RV-failing patients."]},{id:"driving-pressure",name:"Driving pressure",domain:"respiratory",level:3,summary:"Plateau pressure minus total PEEP; a bedside expression of tidal strain relative to respiratory-system compliance.",prereq:["peep"],related:["ards","compliance","mechanical-power"],vocabulary:["plateau pressure","tidal strain"],performance:["Calculate and interpret driving pressure.","Explain why the same tidal volume can have different mechanical consequences in different lungs."]},{id:"compliance",name:"Compliance & elastance",domain:"foundations",level:1,summary:"Compliance describes change in volume for change in pressure; elastance is its inverse.",prereq:[],related:["driving-pressure","ards"],vocabulary:["static compliance","elastance"],performance:["Separate resistance problems from compliance problems using peak and plateau pressures."]},{id:"ards",name:"ARDS physiology",domain:"respiratory",level:3,summary:"Diffuse inflammatory lung injury producing heterogeneity, shunt, low aerated lung volume and risk from ventilator-induced injury.",prereq:["compliance","peep"],related:["driving-pressure","pvr","oxygen-delivery"],vocabulary:["baby lung","shunt","recruitability"],performance:["Integrate oxygenation, mechanics, recruitability and hemodynamics rather than treating a P/F ratio in isolation."]},{id:"mechanical-power",name:"Mechanical power",domain:"respiratory",level:4,summary:"Energy delivered to the respiratory system over time from pressure, volume, flow and respiratory rate.",prereq:["driving-pressure"],related:["ards"],vocabulary:["energy load","ventilator-induced lung injury"],performance:["Explain how respiratory rate and flow can increase ventilator energy even when tidal volume appears acceptable."]},{id:"dead-space",name:"Dead space",domain:"respiratory",level:3,summary:"Ventilation that does not effectively participate in CO2 exchange, from conducting airways or ventilated but poorly perfused alveoli.",prereq:[],related:["pe","ards","etco2-gap"],vocabulary:["VD/VT","alveolar dead space"],performance:["Use PaCO2\u2013EtCO2 behavior and minute ventilation requirements to reason about changing dead space."]},{id:"oxygen-delivery",name:"Oxygen delivery",domain:"hemodynamics",level:3,summary:"DO2 is cardiac output multiplied by arterial oxygen content; saturation alone does not describe tissue oxygen delivery.",prereq:[],related:["oxygen-extraction","shock","transfusion"],vocabulary:["CaO2","DO2","VO2"],performance:["Predict effects of hemoglobin, saturation and flow on oxygen delivery.","Explain why a normal SpO2 can coexist with inadequate DO2."]},{id:"oxygen-extraction",name:"Oxygen extraction",domain:"hemodynamics",level:4,summary:"The relationship between delivered and consumed oxygen reflected by venous saturation and tissue extraction.",prereq:["oxygen-delivery"],related:["shock","lactate"],vocabulary:["O2ER","SvO2","critical DO2"],performance:["Interpret low or high venous saturation in context rather than labeling it simply good or bad."]},{id:"shock",name:"Shock phenotyping",domain:"hemodynamics",level:3,summary:"Identify inadequate effective circulation by integrating flow, vascular tone, congestion, oxygen delivery and organ response.",prereq:["oxygen-delivery"],related:["septic-shock","rv-failure","cardiogenic-shock"],vocabulary:["flow","tone","congestion","perfusion"],performance:["Recognize mixed shock.","Choose an intervention that tests a physiologic hypothesis and define the response expected if that hypothesis is correct."]},{id:"lactate",name:"Lactate physiology",domain:"renal-metabolic",level:3,summary:"Lactate reflects production and clearance across multiple pathways and is not a direct tissue-hypoxia meter.",prereq:["oxygen-delivery"],related:["shock","septic-shock"],vocabulary:["adrenergic glycolysis","clearance"],performance:["Generate hypoxic and non-hypoxic explanations for elevated lactate.","Interpret trajectory alongside perfusion rather than in isolation."]},{id:"acid-base",name:"Advanced acid-base reasoning",domain:"renal-metabolic",level:4,summary:"Integrate respiratory and metabolic processes, compensation, anion gap, albumin, chloride and mixed disorders.",prereq:[],related:["strong-ion","dka"],vocabulary:["delta gap","expected compensation"],performance:["Identify mixed disorders that a single pH label hides.","Connect acid-base abnormalities to the underlying physiology and treatment."]},{id:"strong-ion",name:"Strong-ion approach",domain:"renal-metabolic",level:5,summary:"A physicochemical framework using strong-ion difference, total weak acids and PCO2 to explain acid-base state.",prereq:["acid-base"],related:[],vocabulary:["SID","Atot"],performance:["Use the framework to explain hyperchloremic acidosis and effects of albumin without treating it as a competing religion to bicarbonate-based analysis."]},{id:"icp-cpp",name:"ICP, CPP & cerebral perfusion",domain:"neuro",level:3,summary:"Cerebral perfusion depends on the gradient across the cerebral circulation and is influenced by pressure, venous outflow, CO2 and intracranial compliance.",prereq:[],related:["herniation","evd"],vocabulary:["CPP","autoregulation","Monro-Kellie"],performance:["Predict how systemic pressure, CO2 and venous pressure affect cerebral perfusion.","Recognize when a normal MAP does not guarantee adequate CPP."]},{id:"evd",name:"EVD management",domain:"procedures",level:3,summary:"External ventricular drainage requires correct leveling, clamping during movement and interpretation of drainage and ICP.",prereq:["icp-cpp"],related:["herniation"],vocabulary:["tragus","foramen of Monro"],performance:["Explain over-drainage versus under-drainage from transducer/chamber position.","Mentally rehearse safe movement and re-leveling."]},{id:"arterial-line",name:"Arterial line",domain:"procedures",level:3,summary:"Placement, setup, leveling, zeroing, waveform interpretation and troubleshooting of invasive arterial pressure monitoring.",prereq:[],related:["waveform-damping"],vocabulary:["phlebostatic axis","dynamic response"],performance:["Differentiate patient physiology from damping/resonance artifact.","Mentally rehearse sterile insertion and transducer setup."]},{id:"waveform-damping",name:"Arterial waveform damping & resonance",domain:"imaging-monitoring",level:4,summary:"The monitoring system can distort systolic and diastolic pressures while mean pressure is relatively preserved.",prereq:["arterial-line"],related:[],vocabulary:["square-wave test","natural frequency"],performance:["Recognize over- and under-damped systems and troubleshoot tubing, bubbles, clot and excessive resonance."]},{id:"efast",name:"eFAST",domain:"imaging-monitoring",level:3,summary:"Structured point-of-care ultrasound for pericardial, intraperitoneal and pleural pathology in trauma.",prereq:[],related:["ptx-us","hemoperitoneum"],vocabulary:["Morison pouch","splenorenal","lung sliding"],performance:["Acquire and orient the core windows.","Recognize free fluid and common ",name:"Ultrasound-guided peripheral IV",domain:"procedures",level:2,summary:"Ultrasound-guided peripheral access combines vessel selection, needle-tip tracking, catheter length and post-placement assessment.",prereq:[],related:["central-line"],vocabulary:["short axis","long axis","tip tracking","catheter-to-vein ratio"],performance:["Choose an appropriate target by depth, diameter and course.","Keep the true needle tip accounted for and anticipate failure from a catheter that is too short for the vessel depth."]},{id:"airway-rsi",name:"RSI preparation & peri-intubation physiology",domain:"procedures",level:4,summary:"RSI is a physiologic resuscitation that includes preoxygenation, hemodynamic preparation, drug strategy, positioning, backup planning and post-intubation care.",prereq:["oxygen-delivery","ppv-hemodynamics"],related:["sedation-analgesia","vent-troubleshooting","rv-failure"],vocabulary:["preoxygenation","apneic oxygenation","first-pass success","peri-intubation arrest"],performance:["Identify physiologically difficult airways before induction.","Build an airway plan that includes hemodynamics and the first five minutes after tube placement."]},{id:"post-intubation",name:"Post-intubation stabilization",domain:"procedures",level:3,summary:"Tube confirmation is the beginning of post-intubation care: oxygenation, ventilation, hemodynamics, sedation, ventilator setup and diagnosis must be reassessed together.",prereq:["airway-rsi"],related:["vent-troubleshooting","sedation-analgesia","ppv-hemodynamics"],vocabulary:["waveform capnography","post-intubation hypotension","analgosedation"],performance:["Run a reproducible first-five-minutes stabilization sequence.","Treat hypotension or hypoxemia as a physiology problem rather than simply changing one ventilator or medication setting."]},{id:"sodium-disorders",name:"Sodium & water disorders",domain:"renal-metabolic",level:4,summary:"Sodium concentration reflects water balance relative to body solute; neurologic ri
