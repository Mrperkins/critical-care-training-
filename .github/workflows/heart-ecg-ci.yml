name: Cardiac ECG study regression gate
on:
  push:
    branches:
      - feat/synchronized-heart-ecg-study
  pull_request:
    paths:
      - 'app/src/heart/**'
      - 'app/src/infarct/ecg/**'
      - 'app/src/infarct/data/**'
      - 'app/tests/heart-study-*.test.ts'
      - 'app/src/styles/app.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install exactly locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Production bundle
        run: npm run build
