name: Clinical app validation
on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'tools/validate_visual_assets.py', '.github/workflows/app-ci.yml']
  push:
    branches: ['feat/clinical-completion-*']
    paths: ['app/**', '.github/workflows/app-ci.yml']
permissions:
  contents: read
concurrency:
  group: app-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run audio:audit
      - run: npm run site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual asset validator dependency
        run: python -m pip install numpy==2.2.6
      - name: Validate generated visual assets
        run: python ../tools/validate_visual_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: clinical-app-production-build
          path: app/dist/pub
          retention-days: 7
  bedside-browser-qa:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test desktop, tablet and phone bedside simulation
        env:
          QA_BROWSER: ${{ matrix.browser }}
          QA_HEADED: 1
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/bedside-preview.log 2>&1 &
          xvfb-run --auto-servernum node scripts/vent-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bedside-browser-qa-${{ matrix.browser }}
          path: app/browser-qa
          retention-days: 7
